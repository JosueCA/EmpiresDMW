[HD]
; --- Camera zoom  (ported from EmpiresDMWZoomChanger, LGPL-3.0) --------------
; Multiplier for the camera distance.
;   1.0  = game original (no change)
;   1.5  = recommended for 1920x1080 (further out, shows more of the map)
;   >1.5 = even further out (2.0, 2.5, ...)
Zoom=1.5

; --- Cull / far-clip  (ported from EmpiresDMWZoomChanger, LGPL-3.0) ----------
; Far-clip distance for the terrain (and fog). Increase it if the terrain gets
; visibly "cut off" in the distance when you zoom the camera out.
;   26.29  = game original
;   260.29 = recommended together with Zoom=1.5 at 1920x1080
Cull=260.29

; Neutralizes the engine's gamma-ramp writes (Screen bright setting)
GammaFix=1

; Forces the game's startup resolution
ResolutionOverride=false
ResolutionWidth=1920
ResolutionHeight=1080

; Refresh rate in Hz, written to "Custom Refresh Rate".
ScreenRefresh=0

